<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header>
        <h1>Admin Dashboard</h1>
        <nav>
            <ul>
                <li><a href="admin_dashboard.php">Dashboard</a></li>
                <li><a href="#services-section">Manage Services</a></li>
                <li><a href="#messages-section">View Messages</a></li>
                <li><a href="#quotes-section">View Quotes</a></li>
                <li><a href="logout.php">Logout</a></li>
            </ul>
        </nav>
    </header>

    <section id="services-section">
        <h2>Manage Services</h2>
        <form id="service-form" action="add_service.php" method="POST">
            <div class="form-group">
                <label for="service-name">Service Name:</label>
                <input type="text" id="service-name" name="service-name" required>
            </div>
            <div class="form-group">
                <label for="service-description">Service Description:</label>
                <textarea id="service-description" name="service-description" required></textarea>
            </div>
            <button type="submit" class="btn">Add Service</button>
        </form>

        <h3>Existing Services</h3>
        <ul id="service-list">
            <!-- This section will be populated using JavaScript -->
        </ul>
    </section>

    <section id="messages-section">
        <h2>View Messages</h2>
        <ul id="message-list">
            <!-- Messages will be populated here -->
        </ul>
    </section>

    <section id="quotes-section">
        <h2>View Quotes</h2>
        <ul id="quote-list">
            <!-- Quotes will be populated here -->
        </ul>
    </section>

    <section id="contact-section">
        <h2>Contact Form</h2>
        <form action="https://4e4c-137-196-0-31.ngrok-free.app/utsapi/contact.php" method="POST" id="contact-form" onsubmit="return validateContactForm()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn">Submit</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Urodin Tech Systems. All rights reserved.</p>
    </footer>

    <script>
        // Validate contact form
        function validateContactForm() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            if (name === '' || email === '' || phone === '' || message === '') {
                alert('All fields are required.');
                return false;
            }

            return true;
        }

        // Fetch existing services and populate the list
        async function fetchServices() {
            try {
                const response = await fetch('view_services.php');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const services = await response.json();
                const serviceList = document.getElementById('service-list');
                serviceList.innerHTML = '';  // Clear the list before populating
                services.forEach(service => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        ${service.name} 
                        <button class="delete-btn" data-id="${service.id}">Delete</button>
                    `;
                    serviceList.appendChild(listItem);
                });
    
                // Add event listeners to the delete buttons
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const serviceId = e.target.dataset.id;
                        try {
                            const deleteResponse = await fetch('delete_service.php', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/x-www-form-urlencoded'
                                },
                                body: new URLSearchParams({ 'service_id': serviceId })
                            });
    
                            const deleteResult = await deleteResponse.text();
                            if (deleteResponse.ok) {
                                alert(deleteResult);
                                e.target.parentElement.remove();  // Remove the service from the list
                            } else {
                                throw new Error(deleteResult);
                            }
                        } catch (error) {
                            alert('Error deleting service: ' + error.message);
                        }
                    });
                });
            } catch (error) {
                console.error('Error fetching services:', error);
            }
        }
    
        // Fetch and display quotes
        async function fetchQuotes() {
            try {
                const response = await fetch('view_quotes.php');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const quotesTable = document.getElementById('quotes-table-body');
                quotesTable.innerHTML = '';  // Clear table before populating
                data.forEach(quote => {
                    let row = quotesTable.insertRow();
                    row.innerHTML = `
                        <td>${quote.id}</td>
                        <td>${quote.email}</td>
                        <td>${quote.service_type}</td>
                        <td>${quote.project_size}</td>
                        <td>${quote.budget}</td>
                        <td>${quote.currency}</td>
                        <td>${quote.timeline}</td>
                        <td>${quote.created_at}</td>
                    `;
                });
            } catch (error) {
                console.error('Error fetching quotes:', error);
            }
        }
    
        // Fetch and display messages
        async function fetchMessages() {
            try {
                const response = await fetch('view_messages.php');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const messagesTable = document.getElementById('messages-table-body');
                messagesTable.innerHTML = '';  // Clear table before populating
                data.forEach(message => {
                    let row = messagesTable.insertRow();
                    row.innerHTML = `
                        <td>${message.id}</td>
                        <td>${message.name}</td>
                        <td>${message.email}</td>
                        <td>${message.phone}</td>
                        <td>${message.message}</td>
                        <td>${message.created_at}</td>
                    `;
                });
            } catch (error) {
                console.error('Error fetching messages:', error);
            }
        }
    
        // Call the functions to load data when the page loads
        window.onload = function() {
            fetchServices();
            fetchQuotes();
            fetchMessages();
        };
    </script>    

</body>
</html>
